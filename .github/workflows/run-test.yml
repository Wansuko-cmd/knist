name: 'テストを実行'

on:
  workflow_dispatch:
  push:
  workflow_run:
    workflows: ['CPUのビルド', 'GPUのビルド']
    types: [completed]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 仮想ブランチにチェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ${{ github.workspace }}/gradlew

      - name: SW GPUドライバーを追加
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb vulkan-tools

      - name: テストを実行
        shell: bash
        env:
          SKIP_GPU_TESTS: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./gradlew buffer:allTest -x :buffer:iosSimulatorArm64Test
          else
            ./gradlew buffer:allTest
          fi
          ./gradlew io-type:allTest
          ./gradlew network:allTest

      - name: Android テストを実行
        if: runner.os == 'Linux'
        run: |
          ./gradlew buffer:testAndroidHostTest
          ./gradlew io-type:testAndroidHostTest
          ./gradlew network:testAndroidHostTest
