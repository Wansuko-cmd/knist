name: 'GPUのビルド'

on:
  workflow_dispatch:
  push:
    paths:
      - 'buffer/gpu/rs/**'
      - '.github/workflows/build-gpu-lib.yml'

jobs:
  build-jvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            os_name: macos
            arch: Arm64
            lib_extension: dylib
          - os: macos-15-intel
            os_name: macos
            arch: X64
            lib_extension: dylib
          # Linux
          - os: ubuntu-latest
            os_name: linux
            arch: X64
            lib_extension: so
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: Arm64
            lib_extension: so
          # Windows
          - os: windows-latest
            os_name: mingw
            arch: X64
            lib_extension: dll

    runs-on: ${{ matrix.os }}
    name: Build JVM (${{ matrix.os_name }}/${{ matrix.arch }})

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ./gradlew

      - name: キャッシュを復元
        uses: actions/cache@v4
        with:
          path: buffer/gpu/cpp/rs/target
          key: gpu-jvm-${{ hashFiles('buffer/gpu/rs/Cargo.toml') }}-${{ matrix.os_name }}-${{ matrix.arch }}

      - name: ネイティブライブラリをビルド(Windows以外)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew buffer:gpu:rs:cargoJvmBuild

      - name: vcvarsall.batへのパスを取得
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = vswhere -latest -property installationPath
          $vcvarsPath = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"

          echo "VCVARSALL_PATH=$vcvarsPath" >> $env:GITHUB_ENV

      - name: ネイティブライブラリをビルド(Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" x64
          call gradlew.bat buffer:gpu:rs:cargoJvmBuild

      - name: 成果物をアップロード (Windows以外)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-jvm-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/gpu/rs/target/release/libgpu.${{ matrix.lib_extension }}
          if-no-files-found: error

      - name: 成果物をアップロード (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-jvm-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/gpu/rs/target/release/gpu.${{ matrix.lib_extension }}
          if-no-files-found: error

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            os_name: macos
            arch: Arm64
            lib_extension: a
          - os: macos-15-intel
            os_name: macos
            arch: X64
            lib_extension: a
          # Linux
          - os: ubuntu-latest
            os_name: linux
            arch: X64
            lib_extension: a
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: Arm64
            lib_extension: a
          # Windows
          - os: windows-latest
            os_name: mingw
            arch: X64
            lib_extension: a

    runs-on: ${{ matrix.os }}
    name: Build Native (${{ matrix.os_name }}/${{ matrix.arch }})

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: gradlewに権限を付与 (Unix)
        if: runner.os != 'Windows'
        run: chmod 777 ./gradlew

      # 日付は buffer/gpu/rs/build.gradle.kts 内と同期させる
      - name: nightlyのセットアップ (シンボル改名に使用)
        run: rustup toolchain install nightly-2026-11-03 --profile minimal

      - name: ネイティブライブラリをビルド(Windows以外)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew buffer:gpu:rs:cargoNativeBuild

      - name: MinGWをPATHに追加 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files/Git/mingw64/bin" >> $GITHUB_PATH

      - name: MinGW Rustターゲットを追加 (Windows)
        if: runner.os == 'Windows'
        run: rustup target add --toolchain nightly-2026-11-03 x86_64-pc-windows-gnu

      - name: ネイティブライブラリをビルド(Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew buffer:gpu:rs:cargoNativeBuild -Ptarget=x86_64-pc-windows-gnu

      - name: 成果物をアップロード (Windows以外)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-native-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/gpu/rs/target/release/libgpu.${{ matrix.lib_extension }}
          if-no-files-found: error

      - name: 成果物をアップロード (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-native-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            buffer/gpu/rs/target/x86_64-pc-windows-gnu/release/libgpu.${{ matrix.lib_extension }}
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    name: Build Android

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Javaのセットアップ
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: gradlewに権限を付与
        run: chmod 777 ./gradlew

      - name: キャッシュを復元
        uses: actions/cache@v4
        with:
          path: buffer/gpu/rs/target
          key: gpu-android-${{ hashFiles('buffer/gpu/rs/Cargo.toml') }}

      - name: Android NDK のセットアップ
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Rust の Android ターゲットを追加
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: NDK クロスコンパイラを PATH に追加
        run: echo "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: ネイティブライブラリをビルド (arm64-v8a)
        run: ./gradlew buffer:gpu:rs:cargoAndroidArm64Build

      - name: ネイティブライブラリをビルド (x86_64)
        run: ./gradlew buffer:gpu:rs:cargoAndroidX64Build

      - name: 成果物をアップロード (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-android-arm64-v8a
          path: buffer/gpu/rs/target/aarch64-linux-android/release/libgpu.so
          if-no-files-found: error

      - name: 成果物をアップロード (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-android-x86_64
          path: buffer/gpu/rs/target/x86_64-linux-android/release/libgpu.so
          if-no-files-found: error

  commit:
    needs: [build-jvm, build-native, build-android]
    runs-on: ubuntu-latest
    name: Commit native libraries

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: 全成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: アーティファクト構造を確認
        run: |
          echo "=== Artifacts structure ==="
          find artifacts -type f

      - name: 成果物をresourcesに配置 (JVM)
        run: |
          # macOS/Arm64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/macos/Arm64
          find artifacts/gpu-jvm-macos-Arm64 -name "libgpu.dylib" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/macos/Arm64/ \;

          # macOS/X64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/macos/X64
          find artifacts/gpu-jvm-macos-X64 -name "libgpu.dylib" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/macos/X64/ \;

          # Linux/X64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/linux/X64
          find artifacts/gpu-jvm-linux-X64 -name "libgpu.so" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/linux/X64/ \;

          # Linux/Arm64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/linux/Arm64
          find artifacts/gpu-jvm-linux-Arm64 -name "libgpu.so" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/linux/Arm64/ \;

          # Windows/X64
          mkdir -p buffer/gpu/src/jvmMain/resources/gpu/mingw/X64
          find artifacts/gpu-jvm-mingw-X64 -name "gpu.dll" -exec cp {} buffer/gpu/src/jvmMain/resources/gpu/mingw/X64/ \;

          echo "=== JVM Resources structure ==="
          find buffer/gpu/src/jvmMain/resources -type f

      - name: 成果物をresourcesに配置 (Native)
        run: |
          mkdir -p buffer/gpu/src/nativeMain/resources/gpu/macosArm64
          find artifacts/gpu-native-macos-Arm64 -name "libgpu.a" -exec cp {} buffer/gpu/src/nativeMain/resources/gpu/macosArm64/ \;

          mkdir -p buffer/gpu/src/nativeMain/resources/gpu/macosX64
          find artifacts/gpu-native-macos-X64 -name "libgpu.a" -exec cp {} buffer/gpu/src/nativeMain/resources/gpu/macosX64/ \;

          mkdir -p buffer/gpu/src/nativeMain/resources/gpu/linuxX64
          find artifacts/gpu-native-linux-X64 -name "libgpu.a" -exec cp {} buffer/gpu/src/nativeMain/resources/gpu/linuxX64/ \;

          mkdir -p buffer/gpu/src/nativeMain/resources/gpu/linuxArm64
          find artifacts/gpu-native-linux-Arm64 -name "libgpu.a" -exec cp {} buffer/gpu/src/nativeMain/resources/gpu/linuxArm64/ \;

          mkdir -p buffer/gpu/src/nativeMain/resources/gpu/mingwX64
          find artifacts/gpu-native-mingw-X64 -name "libgpu.a" -exec cp {} buffer/gpu/src/nativeMain/resources/gpu/mingwX64/ \;

          echo "=== Native Resources structure ==="
          find buffer/gpu/src/nativeMain/resources -type f

      - name: 成果物をjniLibsに配置 (Android)
        run: |
          # arm64-v8a
          mkdir -p buffer/gpu/src/androidMain/jniLibs/arm64-v8a
          find artifacts/gpu-android-arm64-v8a -name "libgpu.so" -exec cp {} buffer/gpu/src/androidMain/jniLibs/arm64-v8a/ \;

          # x86_64
          mkdir -p buffer/gpu/src/androidMain/jniLibs/x86_64
          find artifacts/gpu-android-x86_64 -name "libgpu.so" -exec cp {} buffer/gpu/src/androidMain/jniLibs/x86_64/ \;

          echo "=== jniLibs structure ==="
          find buffer/gpu/src/androidMain/jniLibs -type f

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add buffer/gpu/src/jvmMain/resources/ buffer/gpu/src/nativeMain/resources/ buffer/gpu/src/androidMain/jniLibs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[CI] Update GPU libraries"
            git push
          fi
