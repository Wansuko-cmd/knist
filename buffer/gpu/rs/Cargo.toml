[package]
name = "gpu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bench]]
name = "reduction"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "shape"
harness = false

[[bench]]
name = "compare"
path = "benches/elementwise/compare.rs"
harness = false

[[bench]]
name = "math"
path = "benches/elementwise/math.rs"
harness = false

[[bench]]
name = "operation"
path = "benches/elementwise/operation.rs"
harness = false

[[bench]]
name = "mat_mul"
path = "benches/linalg/mat_mul.rs"
harness = false

[dependencies]
bytemuck = "1.25.0"
jni = "0.21.1"
pollster = "0.4.0"
wgpu = "28.0.0"

[dev-dependencies]
criterion = "0.8.2"

[features]
default = ["jni", "native"]
jni = []
native = []

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
